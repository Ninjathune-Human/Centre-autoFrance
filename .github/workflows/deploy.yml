name: Données et publication

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 4 * * 1"   # chaque lundi à 4 h UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collecte des centres
        run: python3 scripts/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publication
        id: deployment
        uses: actions/deploy-pages@v5
